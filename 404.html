<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rallyd</title>
<meta property="og:title" content="Rallyd">
<meta property="og:description" content="Score. Track. Compete. Multi-sport scoring, stats and rating.">
<meta property="og:image" content="https://rallyd.app/images/shot-play.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  /* Tokens mirror index.html so the fallback reads as the same site. */
  :root{--ink:#0A0A0B;--surface:#151519;--line:rgba(255,255,255,.08);--line-green:rgba(57,255,20,.22);
        --green:#39FF14;--text:#F5F5F0;--muted:#9A9AA0;--dim:#63636A;
        --mono:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
        --sans:'DM Sans',-apple-system,system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
  body{background:var(--ink);color:var(--text);font-family:var(--sans);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
  .card{max-width:420px;width:100%;text-align:center}
  .logo{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:.28em;color:var(--green);margin-bottom:28px}
  .logo a{color:inherit;text-decoration:none}
  .preview{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px 22px 26px;margin-bottom:20px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--green);margin-bottom:12px}
  h1{font-family:var(--mono);font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1.15;margin-bottom:10px;text-wrap:balance}
  .sub{font-size:15px;color:var(--muted);line-height:1.55}
  .btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:16px;font-weight:700;
       text-decoration:none;margin-bottom:12px;transition:opacity .2s}
  .btn:active{opacity:.7}
  .btn-primary{background:var(--green);color:#000}
  .btn-secondary{background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line)}
  .btn-disabled{background:rgba(255,255,255,.05);color:var(--dim);border:1px solid var(--line);pointer-events:none}
  .hint{font-size:13px;color:var(--dim);line-height:1.55;margin-top:4px}
  .home{display:inline-block;margin-top:18px;font-size:13px;color:var(--muted)}
  .footer{margin-top:34px;font-size:11px;font-family:var(--mono);letter-spacing:.18em;color:var(--dim)}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><a href="/">RALLYD</a></div>
  <div class="preview">
    <div class="eyebrow" id="eyebrow">Page not found</div>
    <h1 id="title">Nothing here</h1>
    <p class="sub" id="subtitle">We couldn't find what you're looking for.</p>
  </div>
  <a class="btn btn-primary" id="open-app" href="#" hidden>Open in Rallyd</a>
  <a class="btn btn-secondary" id="store" hidden>Get Rallyd on the App Store</a>
  <p class="hint" id="hint" hidden>Already installed? Tap your link again — it opens straight into the app.</p>
  <a class="home" href="/">Back to rallyd.app</a>
  <p class="footer">RALLYD — SCORE. TRACK. COMPETE.</p>
</div>
<script>
(function () {
  // App Store listing URL — drop the real link in when the listing goes live
  // (index.html's download CTA flips at the same moment). null = "coming soon".
  var APP_STORE_URL = null;

  var path = window.location.pathname;
  var match = path.match(/^\/m\/([^\/]+)\/?$/);
  var group = path.match(/^\/g\/([^\/]+)\/?$/);
  if (!match && !group) return; // a plain 404 keeps the static copy above

  var el = function (id) { return document.getElementById(id); };
  var eyebrow = el('eyebrow'), title = el('title'), subtitle = el('subtitle');
  var openBtn = el('open-app'), store = el('store'), hint = el('hint');

  if (match) {
    var hasClaim = window.location.hash.indexOf('claim=') === 1;
    eyebrow.textContent = 'Shared match';
    title.textContent = 'Match shared with you';
    subtitle.textContent = hasClaim
      ? 'Open it in Rallyd to see the full scorecard — and claim your spot in it.'
      : 'Open it in Rallyd to see the full scorecard and stats.';
    // The rallyd:// shape mirrors the https one, fragment included — a claim
    // token rides location.hash, which never reached this server.
    openBtn.href = 'rallyd://m/' + encodeURIComponent(match[1]) + window.location.hash;
    openBtn.hidden = false;
  } else {
    eyebrow.textContent = 'Group invite';
    title.textContent = "You're invited to a group on Rallyd";
    subtitle.textContent = 'Get the app to join the group and play.';
    // No in-app group destination until 1.0.1 — the store CTA carries this page.
  }

  if (APP_STORE_URL) {
    store.href = APP_STORE_URL;
    store.textContent = 'Get Rallyd on the App Store';
  } else {
    store.classList.add('btn-disabled');
    store.textContent = 'Coming soon on the App Store';
  }
  store.hidden = false;
  hint.hidden = false;
})();
</script>
</body>
</html>
