<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Page not found — Rallyd</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #0a0e0a; color: #fff; font-family: -apple-system, system-ui, sans-serif; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .logo { margin: 0 0 24px; color: #39ff14; font-size: 48px; font-weight: 800; letter-spacing: -2px; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { color: #b5bcb5; line-height: 1.6; }
    .button { display: block; padding: 16px; border-radius: 14px; margin: 12px 0;
      text-decoration: none; font-size: 17px; font-weight: 700; background: #39ff14; color: #06140a; }
    .secondary { background: #191e19; color: #fff; border: 1px solid #3c453c; }
    a:focus-visible { outline: 3px solid #39ff14; outline-offset: 4px; }
    .home { display: inline-block; margin-top: 24px; color: #b5bcb5; }
    .note { font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="logo">Rallyd</p>
    <h1 id="title">Page not found</h1>
    <p id="description">We couldn't find that page. Head back to Rallyd's home page.</p>
    <section id="link-actions" hidden aria-label="Open the Rallyd app">
      <a class="button" id="open-app">Open in Rallyd</a>
      <a class="button secondary" id="apple-download" href="https://apps.apple.com/app/id6777384063" rel="noreferrer">Get Rallyd on the App Store</a>
      <p class="note" id="install-note"></p>
      <p class="note" id="android-note">Android is currently in private testing.</p>
    </section>
    <noscript><p>To open a shared match or group, enable JavaScript and reload this page, or open Rallyd directly.</p></noscript>
    <a class="home" href="/" rel="noreferrer">Back to Rallyd</a>
  </main>
  <script src="/ShareLinkStrings.js"></script>
  <script>
    (function () {
      // Only known single-ID routes may create an app link. Never render IDs or
      // fragment contents, send them to a server, or automatically navigate.
      var route = window.location.pathname.match(/^\/(m|g)\/([A-Za-z0-9_-]+)\/?$/);
      if (!route) return;

      function refreshInvitation() {
        var claiming = route[1] === 'm' && /(?:^#|&)(?:claim|invite)=[^&]+/.test(window.location.hash);
        var title = claiming ? ShareLinkStrings.claimTitle : ShareLinkStrings.openTitle;
        document.title = title;
        document.getElementById('title').textContent = title;
        document.getElementById('description').textContent = claiming
          ? ShareLinkStrings.claimDescription
          : (route[1] === 'm' ? ShareLinkStrings.matchDescription : ShareLinkStrings.groupDescription);
        var agent = navigator.userAgent || '';
        var android = /Android/i.test(agent);
        document.getElementById('apple-download').hidden = android;
        document.getElementById('android-note').hidden = /iPhone|iPad|iPod/i.test(agent);
        document.getElementById('android-note').textContent = ShareLinkStrings.androidAvailability;
        document.getElementById('install-note').textContent = android
          ? ShareLinkStrings.androidInstructions
          : ShareLinkStrings.installInstructions;
        // Keep the current fragment in the local app hand-off only. A replacement
        // invite for this match can change only the hash, without reloading Pages.
        document.getElementById('open-app').href = 'rallyd://' + route[1] + '/' + route[2] + window.location.hash;
        document.getElementById('link-actions').hidden = false;
      }
      refreshInvitation();
      window.addEventListener('hashchange', refreshInvitation);
    })();
  </script>
</body>
</html>
